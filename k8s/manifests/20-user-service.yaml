# 20-user-service.yaml
# User Service：Go + GORM 用户管理微服务
# 无状态服务，使用 Deployment；集群内通过 ClusterIP Service 暴露
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: echoes
  labels:
    app: user-service
spec:
  type: ClusterIP           # 仅集群内部访问，Gateway 通过服务名调用
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: echoes
  labels:
    app: user-service
spec:
  replicas: 2               # 2 副本保证高可用
  strategy:
    type: RollingUpdate     # 滚动更新：先创建新 Pod，再删除旧 Pod
    rollingUpdate:
      maxSurge: 1           # 更新时最多多 1 个 Pod
      maxUnavailable: 0     # 更新时不允许有不可用的 Pod（零停机）
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: echoes/user-service:latest
          imagePullPolicy: IfNotPresent   # 如果本地有镜像就不拉取（开发环境）；生产建议 Always
          ports:
            - containerPort: 8001
              name: http
          env:
            # === 从 ConfigMap 读取非敏感配置 ===
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: USER_SERVICE_PORT
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: ENV
            # === 数据库连接字符串（从 Secret 拼接）===
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: echoes-secrets
                  key: POSTGRES_PASSWORD
            # === Redis ===
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: REDIS_DB
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: echoes-secrets
                  key: REDIS_PASSWORD
            # === JWT & OAuth ===
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: echoes-secrets
                  key: JWT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: echoes-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: echoes-secrets
                  key: GITHUB_CLIENT_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
