# 30-ingress.yaml
# Ingress：将外部 HTTP/HTTPS 流量路由到集群内部 Service
# 需要先安装 Ingress Controller（如 nginx-ingress）
# 安装命令：kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.0/deploy/static/provider/baremetal/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echoes-ingress
  namespace: echoes
  annotations:
    # === nginx-ingress 专用注解 ===
    nginx.ingress.kubernetes.io/rewrite-target: /
    # 去掉路径前缀，将 /api/v1/auth/login 转发给 Gateway 时去掉 /api/v1
    nginx.ingress.kubernetes.io/use-regex: "true"
    # 开启 gzip 压缩
    nginx.ingress.kubernetes.io/server-snippet: |
      gzip on;
      gzip_types text/plain text/css application/json application/javascript;
    # 设置上传文件大小限制（默认 1MB，这里设为 50MB）
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # 连接超时设置
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx   # 使用 nginx Ingress Controller
  rules:
    # === 主域名规则 ===
    # 访问 echoes.local → 转发到 Web 前端
    - host: echoes.local
      http:
        paths:
          # 路径 1：API 请求 → Gateway
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          # 路径 2：静态资源和页面 → Web 前端
          # 注意：/api/v1 已经匹配了，这个规则匹配的是其他所有路径
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
  # === TLS 配置（可选，需要准备证书）===
  # tls:
  #   - hosts:
  #       - echoes.local
  #     secretName: echoes-tls-secret
