# 24-gateway.yaml
# Gateway：Go + Gin API 网关，所有外部流量入口
# 使用 NodePort 暴露到集群外部（或通过 Ingress 暴露）
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: echoes
  labels:
    app: gateway
spec:
  type: ClusterIP       # 如果直接用 NodePort，改这里为 NodePort
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: echoes
  labels:
    app: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: echoes/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: GATEWAY_PORT
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: ENV
            # === 下游服务 ===
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: USER_SERVICE_URL
            - name: MEMORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: echoes-config
                  key: MEMORY_SERVICE_URL
            # === JWT ===
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: echoes-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
