# 02-secret.yaml
# Secret：存放敏感信息（密码、密钥、Token）
# 使用 base64 编码（注意：这不是加密，只是编码！生产环境建议配合 Sealed Secrets 或 Vault）
#
# 生成 base64 的命令：echo -n '你的密码' | base64
# 例如：echo -n 'Echoes@2026!' | base64  →  RWNob2VzQDIwMjYh
apiVersion: v1
kind: Secret
metadata:
  name: echoes-secrets
  namespace: echoes
type: Opaque
data:
  # === 数据库密码 ===
  # echo -n '你的PostgreSQL密码' | base64
  POSTGRES_PASSWORD: ""

  # === Redis 密码 ===
  # echo -n '你的Redis密码' | base64
  REDIS_PASSWORD: ""

  # === MinIO 凭据 ===
  # echo -n 'minioadmin' | base64
  MINIO_ROOT_USER: "bWluaW9hZG1pbg=="
  # echo -n 'minioadmin' | base64
  MINIO_ROOT_PASSWORD: "bWluaW9hZG1pbg=="

  # === JWT 密钥（用于用户认证 Token 签名）===
  # 生成强密钥：openssl rand -base64 32
  # echo -n '你的JWT密钥' | base64
  JWT_SECRET: ""

  # === OAuth 配置（如使用 GitHub 登录）===
  # echo -n '你的GitHub Client ID' | base64
  GITHUB_CLIENT_ID: ""
  # echo -n '你的GitHub Client Secret' | base64
  GITHUB_CLIENT_SECRET: ""

  # === LLM API Keys ===
  # echo -n 'sk-你的OpenAI Key' | base64
  OPENAI_API_KEY: ""
  # echo -n 'sk-ant-你的Anthropic Key' | base64
  ANTHROPIC_API_KEY: ""
